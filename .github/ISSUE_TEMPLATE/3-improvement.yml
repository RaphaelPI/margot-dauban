name: "🔧 Améliorer l'existant"
description: "Changer la mise en page, le comportement ou l'admin d'une fonctionnalité existante"
labels: ["type:improvement", "status:needs-triage"]
body:
  - type: textarea
    id: current
    attributes:
      label: Current behaviour
      description: "Ce que fait le site aujourd'hui."
    validations:
      required: true
  - type: textarea
    id: desired
    attributes:
      label: Desired behaviour
      description: "Ce qu'il devrait faire (maquette bienvenue)."
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why / value
      description: "Ce que ça change pour le visiteur ou pour toi."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] Given ..., when ..., then ...
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Design files
      description: "Optionnel. Glisse ici des captures (PNG, PDF) ou colle un lien Figma. Pour un zip ou une page HTML, passe plutôt par /request ou /build dans Claude Code."
  - type: checkboxes
    id: plan
    attributes:
      label: Options
      options:
        - label: Validate plan before dev
        - label: "Draft: don't start agents yet"
  - type: dropdown
    id: implementer
    attributes:
      label: Implementer
      description: agent = développé automatiquement · human = moi avec /build ou un développeur
      options:
        - agent
        - human
      default: 0
    validations:
      required: true
