name: "💬 Avec mes mots"
description: "Décris ton besoin librement. L'agent de tri le met en forme et pose les questions manquantes."
labels: ["status:needs-triage"]
body:
  - type: textarea
    id: prompt
    attributes:
      label: Prompt
      description: "De quoi as-tu besoin et pourquoi ? Pour qui ? Comment saura-t-on que c'est fini ? Maquette bienvenue."
    validations:
      required: true
  - type: checkboxes
    id: plan
    attributes:
      label: Options
      options:
        - label: Validate plan before dev
        - label: "Draft: don't start agents yet"
  - type: dropdown
    id: implementer
    attributes:
      label: Implementer
      description: agent = développé automatiquement · human = moi avec /build ou un développeur
      options:
        - agent
        - human
      default: 0
    validations:
      required: true
