name: labels

on:
  push:
    branches: [main]
    paths: [.github/labels.json]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -c '.[]' .github/labels.json | while read -r l; do
            gh label create "$(jq -r .name <<<"$l")" --force \
              --color "$(jq -r .color <<<"$l")" --description "$(jq -r .description <<<"$l")"
          done
