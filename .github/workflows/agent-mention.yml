# "@claude ..." in an issue/PR comment by a repo writer: iterate on agent work
# (e.g. "@claude rename this function", "@claude fix the failing test").
name: agent-mention

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  claude:
    if: contains(github.event.comment.body || github.event.review.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v5
        with:
          token: ${{ steps.app.outputs.token }}
      - uses: ./.github/actions/setup
      - uses: anthropics/claude-code-action@v1
        env:
          DATABASE_URL: mongodb://placeholder/ci
          PAYLOAD_SECRET: ci-only-secret-not-used-anywhere-0000
        with:
          # Claude Max subscription only (token from `claude setup-token`). No API key.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: ${{ vars.CLAUDE_DEBUG == 'true' }}
          github_token: ${{ steps.app.outputs.token }}
          plugin_marketplaces: https://github.com/DietrichGebert/ponytail.git
          plugins: ponytail@ponytail
          claude_args: |
            --model ${{ vars.CLAUDE_MODEL_DEV || 'claude-sonnet-5-5' }}
            --max-turns 60
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(pnpm:*),Bash(git:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh issue view:*)"
